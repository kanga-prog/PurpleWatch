---
name: CodeQL readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  source-presence:
    name: Detect analyzable application source
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.detect.outputs.python }}
      javascript-typescript: ${{ steps.detect.outputs.javascript-typescript }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - id: detect
        name: Detect future application source
        run: |
          if git ls-files apps/api | grep -Eq '\.py$'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          if git ls-files apps/web | grep -Eq '\.(js|jsx|ts|tsx)$'; then
            echo "javascript-typescript=true" >> "$GITHUB_OUTPUT"
          else
            echo "javascript-typescript=false" >> "$GITHUB_OUTPUT"
          fi
  analyze-python:
    name: Analyze (python)
    needs: source-presence
    if: ${{ needs.source-presence.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # The action is intentionally configured before application code exists.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d  # v3
        with:
          languages: python
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b  # v3
        with:
          category: /language:python
  analyze-javascript-typescript:
    name: Analyze (javascript-typescript)
    needs: source-presence
    if: ${{ needs.source-presence.outputs.javascript-typescript == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d  # v3
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b  # v3
        with:
          category: /language:javascript-typescript
  codeql-gate:
    name: CodeQL gate
    needs: [source-presence, analyze-python, analyze-javascript-typescript]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce applicable CodeQL results
        env:
          SOURCE_RESULT: ${{ needs.source-presence.result }}
          PYTHON_RESULT: ${{ needs.analyze-python.result }}
          JAVASCRIPT_TYPESCRIPT_RESULT: ${{ needs.analyze-javascript-typescript.result }}
        run: |
          for result in "$SOURCE_RESULT" "$PYTHON_RESULT" "$JAVASCRIPT_TYPESCRIPT_RESULT"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "An applicable CodeQL job did not succeed: $result" >&2
              exit 1
            fi
          done
